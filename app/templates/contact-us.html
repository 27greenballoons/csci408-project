{% extends "base.html" %}
{% load static %}
{% block title %}Contact Us{% endblock %}

{% block content %}
<h1 style="text-align:center; margin-top:20px;">Contact Us</h1>

<form method="post" style="max-width:700px; margin:20px auto;">
  {% csrf_token %}

    {{ form.as_p }}

  <button type="submit"
          style="margin-top:16px; display:block; width:100%; padding:10px 14px; border:none; border-radius:6px; background:#0d6efd; color:#fff; font-weight:600;">
    Send
  </button>
</form>
{% endblock %}
